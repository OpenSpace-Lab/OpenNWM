name: Build and publish public OpenNWM website

on:
  push:
    branches: [main]
    paths:
      - website/**
      - tools/build_project_pages.py
      - tools/publish_website_refinement_20261031.py
      - tests/test_build_project_pages.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-site
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      PUBLIC_SITE_PUBLISH_ENABLED: ${{ secrets.OPENNWM_SITE_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@v6
      - name: Test the public artifact boundary
        run: python3 -m unittest discover -s tests -p test_build_project_pages.py
      - name: Build reviewed static files
        run: python3 tools/build_project_pages.py --output-dir _site
      - name: Upload reviewed website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Check out the public static repository
        if: env.PUBLIC_SITE_PUBLISH_ENABLED == 'true'
        uses: actions/checkout@v6
        with:
          repository: OpenSpace-Lab/OpenNWM-site
          ref: main
          path: public-site
          ssh-key: ${{ secrets.OPENNWM_SITE_DEPLOY_KEY }}
          persist-credentials: true
      - name: Publish reviewed static files
        if: env.PUBLIC_SITE_PUBLISH_ENABLED == 'true'
        env:
          GIT_AUTHOR_NAME: B0B8K1ng
          GIT_AUTHOR_EMAIL: 182785743+B0B8K1ng@users.noreply.github.com
          GIT_COMMITTER_NAME: B0B8K1ng
          GIT_COMMITTER_EMAIL: 182785743+B0B8K1ng@users.noreply.github.com
        run: |
          rsync -a --delete --exclude='.git/' --exclude='.github/' --exclude='/README.md' _site/ public-site/
          git -C public-site add --all
          if git -C public-site diff --cached --quiet; then
            echo "The public website is already up to date."
            exit 0
          fi
          git -C public-site commit -m "Publish website from OpenNWM ${GITHUB_SHA}"
          git -C public-site push origin HEAD:main
      - name: Report optional public-repository sync
        if: env.PUBLIC_SITE_PUBLISH_ENABLED != 'true'
        run: |
          echo 'Website artifact built. Optional public-repository sync is not configured.'
          echo 'The reviewed website artifact is ready. Optional OpenNWM-site synchronization was skipped because OPENNWM_SITE_DEPLOY_KEY is not configured. The separate GitHub Pages deployment job runs only for public repositories.' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: publish
    if: ${{ github.ref == 'refs/heads/main' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy the reviewed website to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
